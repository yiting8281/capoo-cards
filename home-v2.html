<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>貓貓蟲咖波收藏卡牌線上圖鑑</title>

    <link rel="manifest" href="manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap');


        /* =====================================================
           基本色彩
        ===================================================== */

        :root {
            --capoo-blue-deep: #31566B;
            --capoo-blue: #527F96;
            --capoo-blue-light: #DCEAF0;
            --capoo-blue-pale: #EEF4F6;

            --paper: #FCFDFD;
            --background: #F2F6F7;

            --text: #34434A;
            --text-light: #7B8B92;

            --line: #D7E1E5;

            --gold: #A98C4B;
            --silver: #78868D;
            --rainbow: #727A98;
        }


        * {
            box-sizing: border-box;
        }


        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--background);
            color: var(--text);

            /*
             * 很淡的紙張顆粒感
             * 不會影響圖片閱讀
             */
            background-image:
                radial-gradient(
                    rgba(82, 127, 150, 0.035) 0.5px,
                    transparent 0.5px
                );

            background-size: 12px 12px;
        }


        .serif {
            font-family: 'Noto Serif TC', serif;
        }


        /* =====================================================
           Header
        ===================================================== */

        .main-header {
            padding: 24px 10px 22px;
        }


        .header-en {
            font-size: 9px;
            letter-spacing: 0.28em;
            color: var(--capoo-blue);
            font-weight: 600;
            margin-bottom: 7px;
        }


        .header-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 27px;
            font-weight: 600;
            color: var(--capoo-blue-deep);
            letter-spacing: 0.08em;
            line-height: 1.4;
        }


        .header-subtitle {
            margin-top: 6px;
            font-size: 10px;
            color: var(--text-light);
            letter-spacing: 0.13em;
        }


        .header-mark {
            width: 38px;
            height: 2px;
            background: var(--capoo-blue);
            margin: 14px auto 0;
            opacity: 0.7;
        }


        /* =====================================================
           控制面板
        ===================================================== */

        .control-panel {
            background: rgba(252, 253, 253, 0.94);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 17px;
            margin-bottom: 24px;

            box-shadow:
                0 3px 14px rgba(49, 86, 107, 0.045);
        }


        .control-label {
            font-size: 9px;
            letter-spacing: 0.18em;
            color: var(--capoo-blue);
            font-weight: 700;
            margin-bottom: 6px;
        }


        /* =====================================================
           收藏進度
        ===================================================== */

        .progress-main {
            font-family: 'Noto Serif TC', serif;
            font-size: 25px;
            line-height: 1;
            color: var(--capoo-blue-deep);
            font-weight: 600;
        }


        .progress-main span {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 10px;
            color: var(--text-light);
            font-weight: 400;
        }


        .progress-track {
            width: 100%;
            height: 3px;
            background: #E5ECEF;
            margin-top: 13px;
            overflow: hidden;
        }


        .progress-fill {
            height: 100%;
            background: var(--capoo-blue);
            transition: width 0.35s ease;
        }


        .summary-row {
            display: flex;
            gap: 17px;
            margin-top: 9px;
            font-size: 10px;
            color: var(--text-light);
        }


        .summary-row strong {
            color: var(--capoo-blue-deep);
        }


        .summary-row .duplicate {
            color: var(--gold);
        }


        /* =====================================================
           搜尋
        ===================================================== */

        .search-input,
        .filter-select {
            width: 100%;
            border: 1px solid var(--line);
            background: #F7F9FA;
            color: var(--text);

            border-radius: 7px;
            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .search-input {
            padding: 8px 10px;
            font-size: 11px;
        }


        .filter-select {
            padding: 8px 9px;
            font-size: 11px;
        }


        .search-input:focus,
        .filter-select:focus {
            border-color: var(--capoo-blue);

            box-shadow:
                0 0 0 2px rgba(82, 127, 150, 0.08);
        }


        /* =====================================================
           快捷篩選
        ===================================================== */

        .quick-area {
            border-top: 1px solid #E5ECEF;
            margin-top: 14px;
            padding-top: 12px;
        }


        .quick-title {
            font-size: 9px;
            color: var(--text-light);
            letter-spacing: 0.15em;
            margin-bottom: 7px;
        }


        .quick-button {
            border: 1px solid var(--line);
            background: transparent;

            color: var(--text-light);

            padding: 4px 10px;

            border-radius: 999px;

            font-size: 10px;
            white-space: nowrap;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        .quick-button:hover {
            color: var(--capoo-blue-deep);
            background: var(--capoo-blue-pale);
            border-color: #B9CED7;
        }


        /* =====================================================
           工具按鈕
        ===================================================== */

        .utility-button {
            flex: 1;

            border: 1px solid var(--line);
            background: transparent;

            color: var(--text-light);

            padding: 6px 8px;

            border-radius: 7px;

            font-size: 10px;
            font-weight: 500;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        .utility-button:hover {
            background: var(--capoo-blue-pale);
            color: var(--capoo-blue-deep);
            border-color: #B9CED7;
        }


        .trade-button {
            color: var(--capoo-blue-deep);
            border-color: #B9CED7;
        }


        /* =====================================================
           卡片
           
           注意：
           圖片高度維持原本約 128px
        ===================================================== */

        .collection-card {
            background: var(--paper);

            border: 1px solid var(--line);

            border-radius: 10px;

            padding: 9px;

            position: relative;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }


        .collection-card:hover {
            transform: translateY(-2px);

            border-color: #B7CDD6;

            box-shadow:
                0 6px 16px rgba(49, 86, 107, 0.07);
        }


        .collection-card.owned {
            border-color: #A9C2CD;
        }


        /* =====================================================
           卡片上方
        ===================================================== */

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 7px;
        }


        .card-number {
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 0.04em;
            color: var(--capoo-blue-deep);
        }


        .card-series {
            font-size: 8px;
            color: var(--text-light);
        }


        /* =====================================================
           星等
        ===================================================== */

        .card-star {
            font-size: 8px;
            line-height: 1;

            margin-bottom: 6px;

            letter-spacing: 0.03em;
        }


        .star-white {
            color: #849197;
        }


        .star-silver {
            color: var(--silver);
        }


        .star-gold {
            color: var(--gold);
        }


        .star-color {
            color: var(--rainbow);
            font-weight: 600;
        }


        /* =====================================================
           圖片
           
           ★ 維持原本 h-32 的尺寸
        ===================================================== */

        .card-image-area {
            width: 100%;
            height: 128px;

            border-radius: 7px;

            background: #F3F6F7;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            cursor: pointer;

            position: relative;
        }


        .card-image {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            transition:
                transform 0.2s ease;
        }


        .card-image-area:hover .card-image {
            transform: scale(1.025);
        }


        /* 未收藏 */

        .card-gray {
            filter: grayscale(100%);
            opacity: 0.28;
        }


        /* =====================================================
           放大按鈕
        ===================================================== */

        .preview-button {
            position: absolute;

            bottom: 5px;
            right: 5px;

            width: 23px;
            height: 23px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.7);

            background: rgba(49, 86, 107, 0.72);

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 10px;

            opacity: 0;

            cursor: pointer;

            transition: opacity 0.2s ease;
        }


        .card-image-area:hover .preview-button {
            opacity: 1;
        }


        /* 手機上直接顯示 */

        @media (max-width: 640px) {

            .preview-button {
                opacity: 1;
            }

        }


        /* =====================================================
           卡片底部
        ===================================================== */

        .card-footer {
            border-top: 1px solid #E7EDF0;

            margin-top: 8px;
            padding-top: 7px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .collection-text {
            font-size: 9px;
            color: var(--text-light);
        }


        .count-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }


        .count-number {
            min-width: 18px;

            text-align: center;

            font-family: monospace;

            font-size: 11px;

            font-weight: 700;

            color: var(--capoo-blue-deep);
        }


        .count-button {
            width: 23px;
            height: 23px;

            border-radius: 50%;

            border: 1px solid var(--line);

            background: #F8FAFA;

            color: var(--text-light);

            font-size: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: all 0.15s ease;
        }


        .count-button:hover {
            background: var(--capoo-blue-pale);
            border-color: #B7CDD6;
            color: var(--capoo-blue-deep);
        }


        .count-button.add {
            background: var(--capoo-blue);
            color: white;
            border-color: var(--capoo-blue);
        }


        .count-button.add:hover {
            background: var(--capoo-blue-deep);
            border-color: var(--capoo-blue-deep);
        }


        /* =====================================================
           重複標記
        ===================================================== */

        .duplicate-badge {
            position: absolute;

            top: -6px;
            right: -6px;

            background: #A47745;

            color: white;

            font-size: 8px;

            padding: 3px 7px;

            border-radius: 999px;

            box-shadow:
                0 3px 7px rgba(90, 60, 30, 0.12);
        }


        /* =====================================================
           Modal
        ===================================================== */

        .modal-overlay {
            background: rgba(35, 53, 61, 0.72);

            backdrop-filter: blur(5px);
        }


        .modal-paper {
            background: var(--paper);

            border: 1px solid var(--line);

            border-radius: 12px;

            box-shadow:
                0 20px 50px rgba(30, 50, 60, 0.2);
        }


        .modal-title {
            font-family: 'Noto Serif TC', serif;

            font-size: 16px;

            font-weight: 600;

            color: var(--capoo-blue-deep);
        }


        .modal-close {
            color: var(--text-light);

            transition: color 0.2s ease;
        }


        .modal-close:hover {
            color: var(--capoo-blue-deep);
        }


        .trade-textarea {
            background: #F5F8F9;

            border: 1px solid var(--line);

            color: var(--text);

            border-radius: 8px;

            outline: none;
        }


        /* =====================================================
           手機
        ===================================================== */

        @media (max-width: 640px) {

            body {
                padding: 10px !important;
            }


            .main-header {
                padding-top: 16px;
                padding-bottom: 17px;
            }


            .header-title {
                font-size: 25px;
            }


            .control-panel {
                padding: 14px;
                margin-bottom: 20px;
            }


            .collection-card {
                padding: 7px;
            }


            .card-image-area {
                height: 128px;
            }

        }

    </style>
</head>


<body class="p-3 md:p-6">

<div class="max-w-6xl mx-auto">


    <!-- =====================================================
         Header
    ===================================================== -->

    <header class="main-header text-center">

        <div class="header-en">
            KAPOOBUG · CARD COLLECTION
        </div>

        <h1 class="header-title">
            貓貓蟲咖波
        </h1>

        <div class="header-subtitle">
            卡牌收藏圖鑑　·　NO.001 — NO.099
        </div>

        <div class="header-mark"></div>

    </header>


    <!-- =====================================================
         控制面板
    ===================================================== -->

    <section class="control-panel">


        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">


            <!-- 收藏進度 -->

            <div class="md:col-span-2">

                <div class="control-label">
                    COLLECTION STATUS
                </div>


                <div class="flex items-baseline gap-2">

                    <div
                        id="progress-text"
                        class="progress-main"
                    >
                        0 / 99
                    </div>

                    <span class="text-[10px] text-[#7B8B92]">
                        款已收藏
                    </span>

                </div>


                <div class="progress-track">

                    <div
                        id="progress-bar"
                        class="progress-fill"
                        style="width: 0%"
                    ></div>

                </div>


                <div class="summary-row">

                    <span>
                        已收藏：
                        <strong id="unique-count">0</strong>
                        / 99
                    </span>

                    <span>
                        重複：
                        <strong
                            id="duplicate-count"
                            class="duplicate"
                        >
                            0
                        </strong>
                        張
                    </span>

                </div>

            </div>


            <!-- 搜尋與篩選 -->

            <div>

                <div class="control-label">
                    SEARCH & FILTER
                </div>


                <div class="flex flex-col gap-2">

                    <input
                        type="text"
                        id="search-input"
                        placeholder="搜尋編號，例如 007 或 7"
                        class="search-input"
                    >


                    <select
                        id="filter-type"
                        class="filter-select"
                    >

                        <option value="all">
                            顯示全部卡牌
                        </option>


                        <optgroup label="狀態與重複">

                            <option value="owned">
                                僅顯示：已擁有
                            </option>

                            <option value="missing">
                                僅顯示：未擁有
                            </option>

                            <option value="duplicate">
                                僅顯示：重複卡
                            </option>

                        </optgroup>


                        <optgroup label="依星等">

                            <option value="star-color">
                                彩星
                            </option>

                            <option value="star-gold">
                                金星
                            </option>

                            <option value="star-silver">
                                銀星
                            </option>

                            <option value="star-white">
                                白星
                            </option>

                        </optgroup>


                        <optgroup label="經典系列 1.0">

                            <option value="v1-all">
                                1.0 全部
                            </option>

                            <option value="v1-role">
                                1.0 角色卡牌
                            </option>

                            <option value="v1-birthday">
                                1.0 11周年生日
                            </option>

                            <option value="v1-summer">
                                1.0 夏日主題
                            </option>

                            <option value="v1-american">
                                1.0 美式主題
                            </option>

                            <option value="v1-shop">
                                1.0 門市滿額抽
                            </option>

                        </optgroup>


                        <optgroup label="經典系列 2.0">

                            <option value="v2-all">
                                2.0 全部
                            </option>

                            <option value="v2-role">
                                2.0 角色款
                            </option>

                            <option value="v2-taiwan">
                                2.0 臺灣百味
                            </option>

                            <option value="v2-lazy">
                                2.0 懶洋洋
                            </option>

                        </optgroup>


                        <optgroup label="經典系列 3.0">

                            <option value="v3-all">
                                3.0 全部
                            </option>

                            <option value="v3-role">
                                3.0 角色卡牌
                            </option>

                            <option value="v3-baby">
                                3.0 BABY主題
                            </option>

                            <option value="v3-cyber">
                                3.0 CyberPunCAT
                            </option>

                            <option value="v3-festival">
                                3.0 祭典主題
                            </option>

                            <option value="v3-safari">
                                3.0 郊遊主題
                            </option>

                        </optgroup>

                    </select>

                </div>

            </div>

        </div>


        <!-- 快捷篩選 -->

        <div class="quick-area">

            <div class="quick-title">
                QUICK FILTER
            </div>


            <div class="flex gap-2 overflow-x-auto">

                <button
                    onclick="setQuickFilter('all')"
                    class="quick-button"
                >
                    全部卡片
                </button>


                <button
                    onclick="setQuickFilter('missing')"
                    class="quick-button"
                >
                    查看缺卡
                </button>


                <button
                    onclick="setQuickFilter('duplicate')"
                    class="quick-button"
                >
                    重複交換卡
                </button>


                <button
                    onclick="setQuickFilter('star-color')"
                    class="quick-button"
                >
                    彩星
                </button>

            </div>

        </div>


        <!-- 工具 -->

        <div class="flex gap-2 mt-3">

            <button
                onclick="openTradeModal()"
                class="utility-button trade-button"
            >
                交換清單
            </button>


            <button
                onclick="exportData()"
                class="utility-button"
            >
                備份
            </button>


            <button
                onclick="importData()"
                class="utility-button"
            >
                匯入
            </button>

        </div>

    </section>


    <!-- =====================================================
         卡片網格
    ===================================================== -->

    <div
        id="cards-grid"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"
    ></div>


</div>


<!-- =========================================================
     圖片預覽 Modal
========================================================= -->

<div
    id="image-modal"
    class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden p-4"
    onclick="closeModal()"
>

    <div
        class="modal-paper p-4 max-w-sm w-full relative"
        onclick="event.stopPropagation()"
    >

        <button
            onclick="closeModal()"
            class="absolute top-2 right-3 modal-close text-xl"
        >
            ×
        </button>


        <div
            id="modal-title"
            class="modal-title mb-3"
        >
            卡牌預覽
        </div>


        <div class="w-full flex items-center justify-center bg-[#F3F6F7] rounded-lg p-3">

            <img
                id="modal-img"
                src=""
                class="max-h-[60vh] object-contain rounded"
            >

        </div>

    </div>

</div>


<!-- =========================================================
     交換清單 Modal
========================================================= -->

<div
    id="trade-modal"
    class="fixed inset-0 modal-overlay flex items-center justify-center z-50 hidden p-4"
    onclick="closeTradeModal()"
>

    <div
        class="modal-paper p-5 max-w-md w-full relative flex flex-col max-h-[85vh]"
        onclick="event.stopPropagation()"
    >

        <button
            onclick="closeTradeModal()"
            class="absolute top-3 right-3 modal-close text-xl"
        >
            ×
        </button>


        <div class="control-label">
            CARD TRADING
        </div>


        <h3 class="modal-title mb-1">
            貓貓蟲咖波卡牌交換清單
        </h3>


        <p class="text-[10px] text-[#7B8B92] mb-3">
            已依星等統整分類，可一鍵複製。
        </p>


        <textarea
            id="trade-text"
            readonly
            class="trade-textarea w-full flex-1 min-h-[220px] p-3 text-xs leading-relaxed resize-none"
        ></textarea>


        <div class="mt-4 flex gap-2">

            <button
                onclick="copyTradeText()"
                class="flex-1 bg-[#527F96] hover:bg-[#31566B] text-white font-semibold py-2 rounded-lg text-xs transition"
            >
                複製交換清單
            </button>


            <button
                onclick="closeTradeModal()"
                class="px-4 bg-[#F5F8F9] border border-[#D7E1E5] text-[#7B8B92] rounded-lg text-xs"
            >
                關閉
            </button>

        </div>

    </div>

</div>


<script>


    /* =========================================================
       卡牌資料
    ========================================================= */

    const cardData = [];


    const silvers = [
        72,73,75,78,79,82,83,89,95,97,
        4,10,12,14,17,20,23,27,28,33,
        34,35,36,39,40,44,47,51,53,54,
        62,65
    ];


    const golds = [
        69,74,85,96,
        13,15,16,26,38,45,55,60,64
    ];


    const colors = [
        77,86,93,42,57
    ];


    for (let i = 1; i <= 99; i++) {

        const idStr =
            i.toString().padStart(3, '0');


        const pad2 =
            i.toString().padStart(2, '0');


        let gen =
            i <= 35
                ? "v1"
                : (i <= 65 ? "v2" : "v3");


        let subType = "";
        let subName = "";


        let starType = "star-white";
        let starName = "白星";
        let starTag = "白星";


        /* -----------------------------
           系列分類
        ----------------------------- */

        if (gen === "v1") {

            if (i <= 15) {

                subType = "v1-role";
                subName = "1.0 角色";

            }

            else if (i <= 20) {

                subType = "v1-birthday";
                subName = "1.0 生日";

            }

            else if (i <= 25) {

                subType = "v1-summer";
                subName = "1.0 夏日";

            }

            else if (i <= 30) {

                subType = "v1-american";
                subName = "1.0 美式";

            }

            else {

                subType = "v1-shop";
                subName = "1.0 門市抽";

            }

        }


        else if (gen === "v2") {

            if (i <= 50) {

                subType = "v2-role";
                subName = "2.0 角色";

            }

            else if (i <= 60) {

                subType = "v2-taiwan";
                subName = "2.0 臺灣百味";

            }

            else {

                subType = "v2-lazy";
                subName = "2.0 懶洋洋";

            }

        }


        else {

            if (i <= 74) {

                subType = "v3-role";
                subName = "3.0 角色";

            }

            else if (i <= 85) {

                subType = "v3-baby";
                subName = "3.0 BABY";

            }

            else if (i <= 90) {

                subType = "v3-cyber";
                subName = "3.0 Cyber";

            }

            else if (i <= 95) {

                subType = "v3-festival";
                subName = "3.0 祭典";

            }

            else {

                subType = "v3-safari";
                subName = "3.0 郊遊";

            }

        }


        /* -----------------------------
           星等
        ----------------------------- */

        if (colors.includes(i)) {

            starType = "star-color";
            starName = "彩星";
            starTag = "彩星";

        }

        else if (golds.includes(i)) {

            starType = "star-gold";
            starName = "金星";
            starTag = "金星";

        }

        else if (silvers.includes(i)) {

            starType = "star-silver";
            starName = "銀星";
            starTag = "銀星";

        }


        const imgPath =
            `./images/${gen}-${pad2}.jpg`;


        cardData.push({

            id: idStr,

            num: i,

            pad2: pad2,

            name: `NO.${idStr}`,

            gen,

            subType,

            subName,

            imgUrl: imgPath,

            starType,

            starName,

            starTag

        });

    }


    /* =========================================================
       LocalStorage
    ========================================================= */

    let myCollection =
        JSON.parse(
            localStorage.getItem(
                'capoo_cards_ultimate_final_v100'
            )
        ) || {};


    const cardsGrid =
        document.getElementById(
            'cards-grid'
        );


    const filterType =
        document.getElementById(
            'filter-type'
        );


    const searchInput =
        document.getElementById(
            'search-input'
        );


    /* =========================================================
       統計
    ========================================================= */

    function updateSummaryStats() {

        let ownedCount = 0;

        let duplicateCount = 0;


        cardData.forEach(card => {

            const count =
                myCollection[card.id] || 0;


            if (count > 0) {

                ownedCount++;

            }


            if (count > 1) {

                duplicateCount +=
                    count - 1;

            }

        });


        const percent =
            Math.round(
                (ownedCount / 99) * 100
            );


        document
            .getElementById(
                'progress-text'
            )
            .innerText =
            `${ownedCount} / 99`;


        document
            .getElementById(
                'progress-bar'
            )
            .style.width =
            `${percent}%`;


        document
            .getElementById(
                'unique-count'
            )
            .innerText =
            ownedCount;


        document
            .getElementById(
                'duplicate-count'
            )
            .innerText =
            duplicateCount;

    }


    /* =========================================================
       Render 卡牌
    ========================================================= */

    function renderCards() {

        cardsGrid.innerHTML = '';


        const filter =
            filterType.value;


        const searchVal =
            searchInput.value
                .trim()
                .toLowerCase();


        updateSummaryStats();


        cardData.forEach(card => {

            const count =
                myCollection[card.id] || 0;


            /* 搜尋 */

            if (
                searchVal &&
                !card.id.includes(searchVal) &&
                !card.num
                    .toString()
                    .includes(searchVal)
            ) {

                return;

            }


            /* 篩選 */

            if (filter !== 'all') {

                if (
                    filter === 'owned' &&
                    count === 0
                ) return;


                if (
                    filter === 'missing' &&
                    count > 0
                ) return;


                if (
                    filter === 'duplicate' &&
                    count <= 1
                ) return;


                if (
                    filter.startsWith('star-') &&
                    card.starType !== filter
                ) return;


                if (
                    filter === 'v1-all' &&
                    card.gen !== 'v1'
                ) return;


                if (
                    filter === 'v2-all' &&
                    card.gen !== 'v2'
                ) return;


                if (
                    filter === 'v3-all' &&
                    card.gen !== 'v3'
                ) return;


                if (
                    !filter.startsWith('star-') &&
                    ![
                        'owned',
                        'missing',
                        'duplicate',
                        'v1-all',
                        'v2-all',
                        'v3-all'
                    ].includes(filter) &&
                    card.subType !== filter
                ) return;

            }


            cardsGrid.appendChild(
                createCardElement(
                    card,
                    count
                )
            );

        });

    }


    /* =========================================================
       圖片 fallback
    ========================================================= */

    window.handleImgError =
        function (
            img,
            cardId,
            gen,
            num,
            pad2
        ) {

            let step =
                parseInt(
                    img.dataset.tryStep || '0',
                    10
                );


            step++;

            img.dataset.tryStep =
                step;


            if (step === 1) {

                img.src =
                    `./images/${gen}-${pad2}.png`;

            }

            else if (step === 2) {

                img.src =
                    `./images/${gen}-${num}.jpg`;

            }

            else if (step === 3) {

                img.src =
                    `./images/${gen}-${num}.png`;

            }

            else if (step === 4) {

                img.src =
                    `./images/${gen}-${cardId}.jpg`;

            }

            else if (step === 5) {

                img.src =
                    `./images/${gen}-${cardId}.png`;

            }

            else {

                img.onerror = null;

                img.src =
                    `https://via.placeholder.com/200x280?text=NO.${cardId}`;

            }

        };


    /* =========================================================
       建立卡片
    ========================================================= */

    function createCardElement(
        card,
        count
    ) {

        const isOwned =
            count > 0;


        const isDuplicate =
            count > 1;


        const cardEl =
            document.createElement('div');


        cardEl.id =
            `card-item-${card.id}`;


        cardEl.className =
            `collection-card ${
                isOwned ? 'owned' : ''
            }`;


        cardEl.innerHTML = `

            <div>

                <!-- 卡號與系列 -->

                <div class="card-header-row">

                    <span class="card-number">
                        NO.${card.id}
                    </span>

                    <span class="card-series">
                        ${card.subName}
                    </span>

                </div>


                <!-- 圖片 -->

                <div
                    class="card-image-area"
                    onclick="
                        updateCount(
                            '${card.id}',
                            1
                        )
                    "
                >

                    <img
                        src="${card.imgUrl}"
                        id="img-${card.id}"
                        data-try-step="0"
                        loading="lazy"

                        onerror="
                            handleImgError(
                                this,
                                '${card.id}',
                                '${card.gen}',
                                ${card.num},
                                '${card.pad2}'
                            )
                        "

                        class="card-image ${
                            isOwned
                                ? ''
                                : 'card-gray'
                        }"
                    >


                    <button
                        onclick="
                            event.stopPropagation();

                            openModal(
                                document.getElementById(
                                    'img-${card.id}'
                                ).src,
                                '${card.name}'
                            )
                        "
                        class="preview-button"
                        title="放大看圖"
                    >
                        ⌕
                    </button>

                </div>


                <!-- 卡片底部 -->

                <div class="card-footer">


                    <div>

                        <div
                            class="
                                card-star
                                ${card.starType}
                            "
                        >
                            ${card.starName}
                        </div>


                        <div class="collection-text">
                            收藏
                        </div>

                    </div>


                    <div class="count-controls">


                        <button
                            onclick="
                                updateCount(
                                    '${card.id}',
                                    -1
                                )
                            "
                            class="count-button"
                        >
                            −
                        </button>


                        <span
                            id="count-val-${card.id}"
                            class="count-number"
                        >
                            ${count}
                        </span>


                        <button
                            onclick="
                                updateCount(
                                    '${card.id}',
                                    1
                                )
                            "
                            class="count-button add"
                        >
                            ＋
                        </button>


                    </div>


                </div>

            </div>


            <!-- 重複標記 -->

            <div
                id="badge-dup-${card.id}"
                class="
                    duplicate-badge
                    ${
                        isDuplicate
                            ? ''
                            : 'hidden'
                    }
                "
            >
                多 ${count - 1}
            </div>

        `;


        return cardEl;

    }


    /* =========================================================
       更新收藏數量
    ========================================================= */

    window.updateCount =
        function (
            id,
            delta
        ) {

            let current =
                myCollection[id] || 0;


            current += delta;


            if (current < 0) {

                current = 0;

            }


            myCollection[id] =
                current;


            localStorage.setItem(
                'capoo_cards_ultimate_final_v100',
                JSON.stringify(
                    myCollection
                )
            );


            const card =
                cardData.find(
                    c => c.id === id
                );


            const oldEl =
                document.getElementById(
                    `card-item-${id}`
                );


            if (
                oldEl &&
                card
            ) {

                const newEl =
                    createCardElement(
                        card,
                        current
                    );


                oldEl.replaceWith(
                    newEl
                );

            }


            updateSummaryStats();

        };


    /* =========================================================
       快速篩選
    ========================================================= */

    window.setQuickFilter =
        function (
            filterVal
        ) {

            filterType.value =
                filterVal;


            searchInput.value =
                '';


            renderCards();

        };


    /* =========================================================
       圖片 Modal
    ========================================================= */

    window.openModal =
        function (
            url,
            title
        ) {

            document
                .getElementById(
                    'modal-img'
                )
                .src = url;


            document
                .getElementById(
                    'modal-title'
                )
                .innerText = title;


            document
                .getElementById(
                    'image-modal'
                )
                .classList.remove(
                    'hidden'
                );

        };


    window.closeModal =
        function () {

            document
                .getElementById(
                    'image-modal'
                )
                .classList.add(
                    'hidden'
                );

        };


    /* =========================================================
       交換清單
    ========================================================= */

    window.openTradeModal =
        function () {

            const starsOrder = [

                {
                    key: 'star-color',
                    tag: '彩星'
                },

                {
                    key: 'star-gold',
                    tag: '金星'
                },

                {
                    key: 'star-silver',
                    tag: '銀星'
                },

                {
                    key: 'star-white',
                    tag: '白星'
                }

            ];


            const dupGroups = {

                'star-color': [],
                'star-gold': [],
                'star-silver': [],
                'star-white': []

            };


            const missGroups = {

                'star-color': [],
                'star-gold': [],
                'star-silver': [],
                'star-white': []

            };


            let totalDupCards = 0;

            let totalMissKinds = 0;


            cardData.forEach(card => {

                const count =
                    myCollection[card.id] || 0;


                if (count > 1) {

                    const extra =
                        count - 1;


                    totalDupCards +=
                        extra;


                    dupGroups[
                        card.starType
                    ].push(
                        `NO.${card.id}${
                            extra > 1
                                ? `(x${extra})`
                                : ''
                        }`
                    );

                }

                else if (count === 0) {

                    totalMissKinds++;


                    missGroups[
                        card.starType
                    ].push(
                        `NO.${card.id}`
                    );

                }

            });


            let text =
                `【🐱 貓貓蟲咖波卡牌交換清單 🍖】\n\n`;


            text +=
                `🔥【重複可換出】(多出 ${totalDupCards} 張)：\n`;


            let hasDup = false;


            starsOrder.forEach(s => {

                if (
                    dupGroups[s.key].length > 0
                ) {

                    hasDup = true;


                    text +=
                        `[${s.tag}] ` +
                        dupGroups[s.key].join(', ') +
                        `\n`;

                }

            });


            if (!hasDup) {

                text +=
                    `目前無多餘卡牌可換出～\n`;

            }


            text +=
                `\n❗【徵求缺卡】(缺 ${totalMissKinds} 款)：\n`;


            let hasMiss = false;


            starsOrder.forEach(s => {

                if (
                    missGroups[s.key].length > 0
                ) {

                    hasMiss = true;


                    text +=
                        `[${s.tag}] ` +
                        missGroups[s.key].join(', ') +
                        `\n`;

                }

            });


            if (!hasMiss) {

                text +=
                    `🎉 太強了！已全套集齊畢業！\n`;

            }


            text +=
                `\n歡迎私訊交換，謝謝！`;


            document
                .getElementById(
                    'trade-text'
                )
                .value = text;


            document
                .getElementById(
                    'trade-modal'
                )
                .classList.remove(
                    'hidden'
                );

        };


    window.closeTradeModal =
        function () {

            document
                .getElementById(
                    'trade-modal'
                )
                .classList.add(
                    'hidden'
                );

        };


    window.copyTradeText =
        function () {

            const textarea =
                document.getElementById(
                    'trade-text'
                );


            textarea.select();


            navigator.clipboard
                .writeText(
                    textarea.value
                )
                .then(() => {

                    alert(
                        "📋 交換清單已成功複製到剪貼簿！"
                    );

                });

        };


    /* =========================================================
       備份
    ========================================================= */

    window.exportData =
        function () {

            const dataStr =
                btoa(
                    JSON.stringify(
                        myCollection
                    )
                );


            navigator.clipboard
                .writeText(
                    dataStr
                )
                .then(() => {

                    alert(
                        "🎉 進度代碼已複製到剪貼簿！"
                    );

                });

        };


    /* =========================================================
       匯入
    ========================================================= */

    window.importData =
        function () {

            const code =
                prompt(
                    "請貼上備份進度代碼："
                );


            if (!code) {
                return;
            }


            try {

                const parsed =
                    JSON.parse(
                        atob(code)
                    );


                if (
                    typeof parsed === 'object'
                ) {

                    myCollection =
                        parsed;


                    localStorage.setItem(
                        'capoo_cards_ultimate_final_v100',
                        JSON.stringify(
                            myCollection
                        )
                    );


                    renderCards();


                    alert(
                        "✅ 進度匯入成功！"
                    );

                }

            }

            catch (e) {

                alert(
                    "❌ 代碼格式不正確，請確認後重試！"
                );

            }

        };


    /* =========================================================
       事件
    ========================================================= */

    filterType.addEventListener(
        'change',
        renderCards
    );


    searchInput.addEventListener(
        'input',
        renderCards
    );


    /* =========================================================
       初始化
    ========================================================= */

    renderCards();


</script>

</body>
</html>
